name: 问题反馈（Bug）
description: 徽标不显示、不计数、位置异常、ZCode 启动报错等问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把信息填全，尤其是 `node src/patch.mjs` 的输出和复现步骤。

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: 反馈前确认
      description: 本项目非官方，会修改本地 ZCode 安装目录的 app.asar。
      options:
        - label: 我已知悉本项目会修改本地 ZCode 的 app.asar，ZCode 升级后需要重新打补丁。
          required: true
        - label: 我已从托盘完全退出 ZCode 再启动，并确认问题仍能复现。
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 出了什么问题
      description: 现象 + 复现步骤：在哪个页面、做了什么、预期是什么、实际看到什么。
      placeholder: |
        例：
        1. 打开 ZCode，进入聊天页
        2. 发送一条消息
        3. 预期：工具条出现 tok/s 徽标；实际：没有徽标
    validations:
      required: true

  - type: input
    id: zcode-version
    attributes:
      label: ZCode 版本
      description: 设置 / 关于页里的版本号，或安装目录里的版本信息。
      placeholder: "3.16.2"
    validations:
      required: true

  - type: textarea
    id: patch-output
    attributes:
      label: 补丁状态
      description: 运行 `node src/patch.mjs`，把输出贴在这里。
      render: shell
      placeholder: |
        Already patched; rebuilding the external preload...
        verified: unpacked=true size=...
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图 / 日志 / 其它信息
      description: 样式问题请附截图；有控制台报错请贴报错。
    validations:
      required: false
